databases:
  - name: terraforma-db
    databaseName: terraforma
    plan: basic-256mb

services:
  - type: web
    name: terraforma
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: terraforma-db
          property: connectionString
      # MUST be stable across deploys. Seat tokens are HMACs over code:seat, so rotating this
      # invalidates every live seat and returning players cannot rejoin their rooms.
      # generateValue creates it once and keeps it.
      - key: SEAT_SECRET
        generateValue: true
      # Also stable across deploys: sessions are signed cookies, so rotating this signs
      # everyone out. generateValue creates it once and keeps it.
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
