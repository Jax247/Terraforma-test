<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Terraforma">
  <!-- A 3x3 fragment of the board: slate tiles, one claimed in gold. -->
  <rect width="32" height="32" rx="6" fill="#1b1d22"/>
  <g fill="#333949">
    <rect x="5" y="5" width="6" height="6" rx="1"/>
    <rect x="13" y="5" width="6" height="6" rx="1"/>
    <rect x="21" y="5" width="6" height="6" rx="1"/>
    <rect x="5" y="13" width="6" height="6" rx="1"/>
    <rect x="21" y="13" width="6" height="6" rx="1"/>
    <rect x="5" y="21" width="6" height="6" rx="1"/>
    <rect x="13" y="21" width="6" height="6" rx="1"/>
    <rect x="21" y="21" width="6" height="6" rx="1"/>
  </g>
  <rect x="13" y="13" width="6" height="6" rx="1" fill="#ffd75e"/>
</svg>
